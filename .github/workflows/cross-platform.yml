name: VeilPNG cross-platform validation and portable packaging
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -U pip "setuptools>=68" wheel
      - name: Install VeilPNG with GUI, CV, tests and PyInstaller
        run: python -m pip install -e ".[full,test,build]"
      - name: Core and registration tests
        run: python -m pytest -q
      - name: Platform doctor
        run: python -m veilpng doctor
      - name: GUI smoke test on Linux virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m veilpng.gui --smoke-test
      - name: GUI smoke test on Windows/macOS
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m veilpng.gui --smoke-test
      - name: Build signed-free portable app on native runner
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: VeilPNG-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
