name: VeilPNG cross-platform validation and portable packaging
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime system packages on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 xvfb
      - name: Install dependencies and portable packager
        run: python -m pip install -e ".[full,build,test]"
      - name: Compile public source
        run: python -m compileall -q veilpng
      - name: Synthetic in-memory encryption and privacy self-test
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from PIL import Image, ImageDraw
          from veilpng.core import seal_bytes, unseal_bytes, preview_only, audit_exported_preview
          original = Image.new('RGB', (80, 100), '#C0D0E0')
          memory = BytesIO()
          original.save(memory, format='PNG')
          secret = memory.getvalue()
          mask = Image.new('L', original.size, 0)
          ImageDraw.Draw(mask).rectangle((9, 15, 40, 50), fill=255)
          password = 'CI-Synthetic-Passphrase-Only'
          sealed = seal_bytes(secret, 'synthetic.png', mask, password, 'solid', solid_color='#000000')
          assert unseal_bytes(sealed, password).original_bytes == secret
          public = preview_only(sealed)
          assert audit_exported_preview(sealed, public, password)['mechanical_audit_pass']
          assert b'vpNg' not in public
          print('Synthetic roundtrip & privacy audit passed')
          PY
      - name: Platform doctor
        run: python -m veilpng doctor
      - name: Run complete synthetic regression suite
        run: python -m pytest -q
      - name: GUI smoke test on Linux virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m veilpng.gui --smoke-test
      - name: GUI smoke test on Windows/macOS
        if: runner.os != 'Linux'
        run: python -m veilpng.gui --smoke-test
      - name: Build unsigned portable app on native runner
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: VeilPNG-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
